[pytest]
# For runs from dapp/; keep in step with the pytest.ini in the root.
python_files = tests.py test_*.py *_tests.py
pythonpath = ..
junit_family=legacy
markers =
    testnet: sends transactions to Testnet; run with -m testnet --no-cov
filterwarnings =
    ignore::DeprecationWarning

addopts =
    -v
    -p no:django
    --cov=.
    -m "not testnet"
