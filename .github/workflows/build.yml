name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dapp/requirements.txt

      - name: Install Docker Compose (required by algokit)
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose -y

      - name: Start Algorand LocalNet
        run: |
          algokit localnet start
          until curl -s http://localhost:4001/health; do sleep 1; done

      - name: Compiled artifacts match the contract
        run: |
          algokit compile py dapp/contract.py --out-dir check
          diff dapp/check/VotingDApp.approval.teal dapp/artifacts/VotingDApp.approval.teal

      - name: Run Pytest
        run: |
          cd dapp
          python -m pytest -v --cov-branch --cov-report=xml

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: dapp
          flags: main-project
          name: main-coverage
