[pytest]
# For runs from the repository's root; keep in step with dapp/pytest.ini.
python_files = tests.py test_*.py *_tests.py
pythonpath = .
testpaths = dapp
junit_family=legacy
markers =
    testnet: sends transactions to Testnet; run with -m testnet --no-cov
filterwarnings =
    ignore::DeprecationWarning

addopts =
    -v
    -p no:django
    --cov=dapp
    --cov-config=dapp/.coveragerc
    -m "not testnet"
